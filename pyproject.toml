[project]
name = "blagden"
version = "0.0.1"
description = "Heat intelligence for runners in the tropics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lawrence Panes" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
blagden = "blagden.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blagden"]
