[project]
name = "blagden"
version = "0.0.1"
description = "Heat intelligence for runners in the tropics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lawrence Panes" }]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7",
    "fitdecode>=0.11",
    "numpy>=2.1",
    "typer>=0.15",
]

[project.scripts]
blagden = "blagden.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blagden"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D103"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["blagden"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["blagden.constants", "blagden.physio.*", "blagden.weather.*", "blagden.predict.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["blagden"]
branch = true
